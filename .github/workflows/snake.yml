name: Generate Contribution Snake

# Generates a high-contrast contribution snake and publishes it to the output branch.
# Run manually from Actions, on pushes to main, and automatically every 12 hours.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322c55e&color_dots=%23ebedf0,%23bbf7d0,%234ade80,%2316a34a,%23166534
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234ade80

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
