<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Pradeep Pullamsetty — animated developer ID card</title>
<desc id="desc">Purple glass-inspired animated profile card with links to LinkedIn and GitHub.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".48" stop-color="#312e81"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="25" y="25" width="850" height="380" rx="28"/></clipPath>
</defs>
<rect width="900" height="430" rx="34" fill="#080b16"/>
<g clip-path="url(#clip)">
  <rect x="25" y="25" width="850" height="380" rx="28" fill="url(#bg)"/>
  <circle cx="770" cy="50" r="170" fill="#a78bfa" opacity=".12"><animate attributeName="r" values="145;180;145" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="95" cy="390" r="160" fill="#22d3ee" opacity=".09"><animate attributeName="cx" values="95;150;95" dur="9s" repeatCount="indefinite"/></circle>
  <path d="M-10 330 Q220 180 430 330 T920 260" fill="none" stroke="#c4b5fd" stroke-opacity=".2" stroke-width="2"><animate attributeName="d" values="M-10 330 Q220 180 430 330 T920 260;M-10 280 Q220 390 430 260 T920 310;M-10 330 Q220 180 430 330 T920 260" dur="10s" repeatCount="indefinite"/></path>
  <rect x="45" y="45" width="810" height="340" rx="23" fill="url(#glass)" stroke="url(#edge)" stroke-opacity=".9" stroke-width="1.5"/>
  <rect x="46" y="46" width="808" height="338" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <text x="75" y="82" fill="#e9d5ff" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">DIGITAL DEVELOPER ID</text>
  <circle cx="790" cy="70" r="5" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/></circle>
  <text x="820" y="75" text-anchor="end" fill="#d1fae5" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5">ONLINE • PROFILE</text>
  <circle cx="160" cy="190" r="72" fill="#a78bfa" opacity=".28" filter="url(#glow)"><animate attributeName="r" values="69;75;69" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="190" r="62" fill="#111827" stroke="url(#edge)" stroke-width="2.5"/>
  <text x="160" y="204" text-anchor="middle" fill="#f5f3ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">PP</text>
  <text x="265" y="160" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Pradeep Pullamsetty</text>
  <text x="267" y="194" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="17">Aspiring Software Engineer</text>
  <text x="267" y="224" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="15">Python  •  AI / ML  •  Software Development</text>
  <line x1="75" y1="285" x2="825" y2="285" stroke="#fff" stroke-opacity=".22"/>
  <text x="78" y="316" fill="#a5f3fc" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURRENT MODE</text>
  <text x="78" y="344" fill="#ffffff" font-family="Arial,sans-serif" font-size="17">LEARN  →  BUILD  →  TEST  →  IMPROVE</text>
  <rect x="620" y="308" width="92" height="37" rx="18" fill="#ffffff" fill-opacity=".12" stroke="#c4b5fd" stroke-opacity=".8"/>
  <text x="666" y="331" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">LINKEDIN ↗</text>
  <rect x="723" y="308" width="94" height="37" rx="18" fill="#ffffff" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".8"/>
  <text x="770" y="331" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">GITHUB ↗</text>
  <path d="M52 120 L52 90 Q52 55 87 55" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/>
  <path d="M848 310 L848 340 Q848 375 813 375" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/>
</g>
</svg>